# XcodeGen spec. Generate the project with:  xcodegen generate
# Install XcodeGen once:  brew install xcodegen
name: DocuVault
options:
  bundleIdPrefix: com.evanlai
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES          # Xcode "recommended settings"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: ""        # set in Xcode → Signing & Capabilities on first run
    CODE_SIGN_STYLE: Automatic

packages:
  DocuVaultCore:
    path: DocuVaultCore
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.32+ pulls mlx-swift ≥ 0.31.5, which needs Swift 6.3 (Xcode 26.4). Stay on 3.31.x until the toolchain moves.
    minorVersion: "3.31.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  DocuVault:
    type: application
    platform: iOS
    sources:
      - path: DocuVault
    dependencies:
      - package: DocuVaultCore
        product: DocuVaultCore
      - package: DocuVaultCore
        product: DocuVaultOCR
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - target: DocuVaultKeyboard
        embed: true
    info:
      path: DocuVault/Info.plist
      properties:
        CFBundleDisplayName: DocuVault
        CFBundleShortVersionString: "0.7.0"
        CFBundleVersion: "7"
        DocuVaultKeychainSharing: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: DocuVault scans documents with the camera. Images stay on this device.
        NSPhotoLibraryUsageDescription: DocuVault imports document photos you choose. Images stay on this device.
        NSFaceIDUsageDescription: Face ID opens your vault of sensitive documents.
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: DocuVault/DocuVault.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evanlai.docuvault
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evanlai.docuvault
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  DocuVaultKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: DocuVaultKeyboard
      # Shared with the app: storage models, file locations, vault key access.
      - path: DocuVault/Storage/Models.swift
      - path: DocuVault/Storage/AppFiles.swift
      - path: DocuVault/Vault/VaultSession.swift
    dependencies:
      - package: DocuVaultCore
        product: DocuVaultCore
      - package: DocuVaultCore
        product: DocuVaultOCR
    info:
      path: DocuVaultKeyboard/Info.plist
      properties:
        CFBundleDisplayName: DocuVault
        CFBundleShortVersionString: "0.7.0"
        CFBundleVersion: "7"
        DocuVaultKeychainSharing: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: DocuVaultKeyboard/DocuVaultKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evanlai.docuvault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evanlai.docuvault.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
