name: DocuVaultCore tests

on:
  push:
    paths:
      - "DocuVaultCore/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "DocuVaultCore/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          echo "::notice title=Xcodes on runner::$(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          # iOS 26 SDK is required (Foundation Models). Fail loudly if the runner lacks Xcode 26.
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X26" ] || { echo "::error::Xcode 26 not found on runner"; exit 1; }
          sudo xcode-select -s "$X26"
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: Build and test
        working-directory: DocuVaultCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../test-output.log
      - name: Report
        if: always()
        shell: bash
        run: |
          summary=$(grep -E "Executed [0-9]+ tests" test-output.log | tail -1 || true)
          errors=$(grep -cE "error:" test-output.log || true)
          warnings=$(grep -cE "warning:" test-output.log || true)
          echo "::notice title=Tests::${summary:-no summary line found}"
          echo "::notice title=Compiler::errors=${errors} warnings=${warnings}"
          { grep -E "error:|warning:" test-output.log || true; } | head -40 | while read -r l; do echo "::warning::$l"; done
          { grep -E "failed \(|XCTAssert" test-output.log || true; } | head -40 | while read -r l; do echo "::error::$l"; done
          if [ -z "$summary" ]; then echo "No tests executed"; exit 1; fi
